apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spotify-converter.fullname" . }}-backend-policy
  labels:
    {{- include "spotify-converter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "spotify-converter.backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from frontend pods
    - from:
        - podSelector:
            matchLabels:
              {{- include "spotify-converter.frontend.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
    # Allow traffic from NodePort (external users hitting the API directly)
    - ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spotify-converter.fullname" . }}-frontend-policy
  labels:
    {{- include "spotify-converter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "spotify-converter.frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow inbound HTTP from any source (public-facing frontend)
    - ports:
        - protocol: TCP
          port: {{ .Values.frontend.port }}
