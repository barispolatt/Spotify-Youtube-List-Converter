name: Frontend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'helm/**'

concurrency:
  # Shared with backend-ci — both workflows deploy the same Helm release,
  # so they MUST be serialized. The second deploy queues until the first finishes.
  group: helm-deploy
  
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: spotify-youtube-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd frontend
        docker build \
          --build-arg VITE_LAMBDA_URL=${{ vars.VITE_LAMBDA_URL }} \
          --build-arg VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL }} \
          --build-arg VITE_SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }} \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT

    - name: Copy Helm chart to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "helm/*"
        target: "/home/ubuntu/spotify-project"

    - name: Deploy to EC2 (K3s via Helm)
      uses: appleboy/ssh-action@v1.0.3
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
        SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: ECR_REGISTRY,IMAGE_TAG,ECR_REPOSITORY,SPOTIFY_CLIENT_ID,SPOTIFY_CLIENT_SECRET,CORS_ALLOWED_ORIGINS
        script: |
          # 1. Create/update backend secrets (idempotent via --dry-run + apply)
          sudo k3s kubectl create secret generic backend-secrets \
            --from-literal=SPOTIFY_CLIENT_ID="$SPOTIFY_CLIENT_ID" \
            --from-literal=SPOTIFY_CLIENT_SECRET="$SPOTIFY_CLIENT_SECRET" \
            --from-literal=CORS_ALLOWED_ORIGINS="$CORS_ALLOWED_ORIGINS" \
            --dry-run=client -o yaml | sudo k3s kubectl apply -f -

          # 2. Deploy via Helm (atomic: auto-rollback on failure)
          # Both repos must be set — values-dev.yaml has empty defaults
          sudo helm upgrade --install spotify-converter \
            /home/ubuntu/spotify-project/helm/spotify-converter/ \
            -f /home/ubuntu/spotify-project/helm/spotify-converter/values-dev.yaml \
            --set frontend.image.repository=$ECR_REGISTRY/$ECR_REPOSITORY \
            --set frontend.image.tag=$IMAGE_TAG \
            --set backend.image.repository=$ECR_REGISTRY/spotify-youtube-backend \
            --kubeconfig /etc/rancher/k3s/k3s.yaml \
            --atomic \
            --timeout 5m
